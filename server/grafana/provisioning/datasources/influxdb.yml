apiVersion: 1

datasources:
  - name: InfluxDB - Cold Rooms
    type: influxdb
    access: proxy
    url: $INFLUX_URL
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUX_TOKEN
    isDefault: true
