name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
  push:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  contents: read
  id-token: write # required for OIDC -> AWS

defaults:
  run:
    working-directory: infra/envs/prod

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: terraform fmt
        run: terraform fmt -check -recursive ..

      - name: terraform init (no backend, syntax check only)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          quiet: true
          soft_fail: false

  plan:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_admin_cidr_blocks: ${{ secrets.TF_VAR_ADMIN_CIDR_BLOCKS }}
          TF_VAR_key_pair_name: ${{ secrets.TF_VAR_KEY_PAIR_NAME }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_influx_url: ${{ secrets.TF_VAR_INFLUX_URL }}
          TF_VAR_influx_token: ${{ secrets.TF_VAR_INFLUX_TOKEN }}
          TF_VAR_influx_org: ${{ secrets.TF_VAR_INFLUX_ORG }}
          TF_VAR_influx_bucket: ${{ secrets.TF_VAR_INFLUX_BUCKET }}
          TF_VAR_email_from: ${{ secrets.TF_VAR_EMAIL_FROM }}
          TF_VAR_email_password: ${{ secrets.TF_VAR_EMAIL_PASSWORD }}
          TF_VAR_email_to: ${{ secrets.TF_VAR_EMAIL_TO }}
