name: CI - edge app

on:
  pull_request:
    paths:
      - "edge/app/**"
  push:
    branches: [main]
    paths:
      - "edge/app/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check edge/app/src edge/app/examples

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: edge/app
          push: false
          tags: iot-cold-chain-monitor:ci
